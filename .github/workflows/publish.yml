name: Publish to npm

# Runs when a release draft is published. The release tag (v1.2.3) becomes
# the npm version, so package.json never drifts from the release.
#
# Needs the NPM_TOKEN repository secret: a granular access token on npmjs.com
# with read/write on the package and the "bypass 2FA" flag enabled.
# Skips quietly until the secret exists.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run check && npm test

      - name: Set version from release tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      - name: Publish
        if: env.NPM_TOKEN != ''
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
